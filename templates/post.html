<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} | 墨迹</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="article:published_time" content="{{DATE}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/post.js"></script>
</head>
<body>
  <a class="visually-hidden" href="#postContent">跳到正文</a>

  <header class="masthead">
    <div class="container masthead__inner">
      <a class="masthead__brand" href="../index.html" aria-label="墨迹，返回首页">墨迹</a>
      <span class="masthead__edition">第 {{VERSION}} 期，{{DATE}}</span>
      <nav class="masthead__nav" aria-label="主导航">
        <a href="../index.html">文章归档</a>
        <a href="../index.html#about">关于</a>
        <button id="themeToggle" type="button" aria-pressed="false">深色</button>
      </nav>
    </div>
  </header>

  <main class="container post">
    <article>
      <header class="post__head">
        <a class="post__back" href="../index.html">返回目录</a>
        <h1 id="postTitle" class="post__title">{{TITLE}}</h1>
        <div class="post__meta">
          <span id="postCategory">{{CATEGORY}}</span>
          <time id="postDate" datetime="{{DATE}}">{{DATE}}</time>
        </div>
        <div id="postTags" class="post__tags">{{TAGS}}</div>
      </header>
      <div id="postContent" class="post__body">{{BODY}}</div>
      <div id="postActions" class="post__actions"></div>
    </article>
  </main>

  <footer class="colophon">
    <div class="container colophon__inner">
      <div>
        <p class="colophon__statement">用文字丈量世界</p>
        <p class="colophon__meta">墨迹，<span id="year"></span>。第 {{VERSION}} 期。</p>
      </div>
      <div class="colophon__links">
        <a href="../index.html">文章归档</a>
        <a href="https://github.com/DRGJU" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
    <div class="container"><p id="notice" class="visually-hidden" role="status"></p></div>
  </footer>

  <script type="application/json" id="post-data">{{POST_DATA}}</script>
</body>
</html>
