<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>草稿编辑 | 墨迹博客</title>
  <meta name="description" content="墨迹博客的本地草稿编辑器。修改只保存在当前浏览器，不会发布到网站。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    try {
      var t = localStorage.getItem('juweb:theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="./js/admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#articleList">跳到文章列表</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html">墨迹</a>
      <nav class="header-nav" aria-label="主导航">
        <a href="./index.html">博客</a>
        <a href="./admin.html" aria-current="page">草稿编辑</a>
        <button id="themeToggle" class="icon-btn" type="button" aria-pressed="false">深色</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="banner">
      <strong>这是本地草稿编辑器，不是发布后台。</strong>
      所有修改只保存在当前浏览器的 localStorage，其他访客看不到，也不会写入仓库。
      发布方式：点「导出 JSON」覆盖 <code>data/articles.json</code> → 提交仓库 → 运行 <code>npm run build</code> 生成文章页。
    </div>

    <div class="admin-actions">
      <a class="btn" href="./index.html?draft=1" target="_blank" rel="noopener noreferrer">预览草稿</a>
      <button id="exportBtn" class="btn" type="button">导出 JSON</button>
      <label class="btn" for="importFile">导入 JSON</label>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
      <button id="discardBtn" class="btn btn-danger" type="button">放弃草稿</button>
    </div>

    <div id="notice" class="notice" role="status" hidden></div>

    <div class="admin-grid">
      <section class="panel" aria-labelledby="listTitle">
        <h2 id="listTitle">文章列表 <span id="draftBadge" class="count"></span></h2>
        <div id="articleList"></div>
      </section>

      <section class="panel" aria-labelledby="formTitle">
        <h2 id="formTitle">添加文章</h2>
        <form id="articleForm" novalidate>
          <input type="hidden" id="editId" value="">
          <div class="field">
            <label for="title">标题</label>
            <input id="title" name="title" type="text" required placeholder="文章标题">
          </div>
          <div class="field">
            <label for="category">分类</label>
            <input id="category" name="category" type="text" required placeholder="例如：技术">
          </div>
          <div class="field">
            <label for="tagsInput">标签</label>
            <input id="tagsInput" name="tagsInput" type="text" placeholder="Python, 教程, 技巧">
            <span class="field-hint">用中文或英文逗号分隔，保存时转为数组。</span>
          </div>
          <div class="field">
            <label for="excerpt">摘要</label>
            <textarea id="excerpt" name="excerpt" rows="3" required placeholder="列表页显示的摘要"></textarea>
          </div>
          <div class="field">
            <label for="content">正文</label>
            <textarea id="content" name="content" rows="10" required placeholder="支持有限的 HTML 标签；脚本与事件属性会被自动清除"></textarea>
            <span class="field-hint">发布前会经过白名单消毒，<code>&lt;script&gt;</code>、<code>onerror</code> 等一律移除。</span>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">保存到草稿</button>
            <button class="btn" type="reset">重置表单</button>
          </div>
          <p id="formStatus" class="form-status" role="status"></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span><span id="year"></span> 墨迹. All rights reserved.</span>
      <span>本地草稿 · 不发布</span>
    </div>
  </footer>
</body>
</html>
