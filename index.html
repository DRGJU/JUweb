<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨迹 | 个人博客</title>
  <meta name="description" content="墨迹：一个记录技术探索与日常思考的个人博客。">
  <meta name="theme-color" content="#f7f5f0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="墨迹 | 个人博客">
  <meta property="og:description" content="记录技术探索与日常思考的个人博客。">
  <meta property="og:url" content="https://drgju.github.io/JUweb/">
  <link rel="canonical" href="https://drgju.github.io/JUweb/">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    // 在首屏渲染前应用主题，避免闪烁
    try {
      var t = localStorage.getItem('juweb:theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#articles">跳到正文</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html">墨迹</a>
      <nav class="header-nav" aria-label="主导航">
        <a href="./index.html" aria-current="page">文章</a>
        <a href="./admin.html">草稿编辑</a>
        <button id="themeToggle" class="icon-btn" type="button" aria-pressed="false">深色</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="notice" class="notice" role="status" hidden></div>

    <section id="articles" aria-labelledby="listTitle">
      <div class="section-head reveal">
        <h1 id="listTitle">最新文章</h1>
        <span id="articleCount" class="count"></span>
      </div>
      <div id="articleList" class="article-list" aria-live="polite"></div>
      <nav id="pagination" class="pagination" aria-label="文章分页"></nav>
    </section>

    <section id="about" class="about reveal" aria-labelledby="aboutTitle">
      <h2 id="aboutTitle">关于我</h2>
      <div class="about-grid">
        <div>
          <p>一个热爱技术与文字的普通人。白天写代码，晚上写文章。喜欢探索新技术，也喜欢回味经典。</p>
          <p>相信好的代码像诗一样优雅，好的文章像老友聊天一样自然。这个博客是我的数字花园，记录成长，分享收获。</p>
        </div>
        <div>
          <h3>联系方式</h3>
          <p><a href="https://github.com/DRGJU" target="_blank" rel="noopener noreferrer">GitHub / DRGJU</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span><span id="year"></span> 墨迹. All rights reserved.</span>
      <span>用文字丈量世界</span>
    </div>
  </footer>

  <div class="music-controls">
    <button id="playBtn" class="music-btn" type="button" aria-label="播放背景音乐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.75 11.17l-3.2-2.14A1 1 0 0010 9.87v4.26a1 1 0 001.55.83l3.2-2.13a1 1 0 000-1.66z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </button>
    <button id="pauseBtn" class="music-btn" type="button" aria-label="暂停背景音乐" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </button>
    <audio id="bgMusic" src="./media/bgyy.mp3" loop preload="none"></audio>
  </div>
</body>
</html>
